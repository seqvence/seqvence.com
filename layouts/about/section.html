{{ define "main" }}
<div class="wrap page-intro"><p class="eyebrow accented">About Seqvence</p><h1>The team</h1><div class="lede">{{ .Content }}</div></div>
<section class="wrap people" aria-label="The founders">
  {{ range hugo.Data.team }}
  <article>
    <img class="portrait" src="{{ printf "images/%s" .photo | relURL }}" alt="{{ .name }}" width="358" height="308">
    <h2>{{ .name }}</h2><p>{{ .bio }}</p>
    <div class="profile-links"><a href="{{ .linkedin }}">LinkedIn</a><a href="{{ .twitter }}">Twitter</a></div>
  </article>
  {{ end }}
</section>
{{ end }}
